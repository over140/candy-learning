<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practice Exam · Arabic Revision</title>
  <link rel="stylesheet" href="assets/style.css?v=20261101-4">
</head>
<body>
<main id="exam"></main>
<div class="scorebar" id="bar">
  <span id="progress"></span>
  <button id="submit">Submit answers</button>
  <button class="ghost" id="retryWrong" style="display:none">Redo wrong ones</button>
  <button class="ghost" id="reset">Start again</button>
</div>
<script src="assets/app.js?v=20261101-4"></script>
<script src="data/exams.js?v=20261101-4"></script>
<script>
const setId = new URLSearchParams(location.search).get("set") === "2" ? 2 : 1;
renderHeader(setId === 2 ? "exam2" : "exam1");
const EX = EXAMS[setId];
const STORE = `arabic-exam-${setId}`;
document.title = EX.title + " · Arabic Revision";

// Flatten questions and give each a stable id; shuffle options once per load.
let qn = 0;
EX.sections.forEach((s, si) => s.questions.forEach(q => {
  q.id = `q${++qn}`;
  q.si = si;
  q.answer = q.opts[0];
  q.shown = shuffle(q.opts);
  // Bilingual questions (qAr + optsAr): Arabic shown, English behind the EN button.
  if (q.qAr && q.optsAr) {
    q.arOf = {};
    q.opts.forEach((o, i) => { q.arOf[o] = q.optsAr[i]; });
  }
}));
const ALLQ = EX.sections.flatMap(s => s.questions);

function questionHtml(q) {
  if (q.arOf) {
    return `<div class="q bi" id="${q.id}">
      <div class="qhead">
        <span class="num">${q.id.slice(1)}.</span>
        <span class="qtext"><span class="ar" lang="ar">${esc(q.qAr)}</span><span class="en">${esc(q.q)}</span></span>
        <button type="button" class="en-toggle" data-en="${q.id}" aria-pressed="false" title="Show English">EN</button>
      </div>
      <div class="opts">${q.shown.map(o => `<label class="ar-opt"><input type="radio" name="${q.id}" value="${esc(o)}"> <span class="optbody"><span class="ar" lang="ar">${esc(q.arOf[o])}</span><span class="en">${esc(o)}</span></span></label>`).join("")}</div>
      <div class="exp">💡 ${txt(q.exp)}</div>
    </div>`;
  }
  return `<div class="q" id="${q.id}">
    <span class="num">${q.id.slice(1)}.</span>${esc(q.q)}
    ${q.ar ? `<span class="prompt-ar"><span class="ar" lang="ar">${esc(q.ar)}</span> ${sayBtn(q.ar.replace(/_+/g, " … "))}</span>` : ""}
    <div class="opts">${q.shown.map(o => `<label class="${isArabic(o) ? "ar-opt" : ""}"><input type="radio" name="${q.id}" value="${esc(o)}"> ${txt(o)}</label>`).join("")}</div>
    <div class="exp">💡 ${txt(q.exp)}</div>
  </div>`;
}

/* ---------- Read-along (word highlight while listening) ---------- */
// TOKS[si] = [{ start, end, text }] — character offsets into the spoken text.
const TOKS = {};

function spokenText(s) {
  // Same length as the passage, so character offsets stay aligned.
  return s.passage.replace(/\n/g, " ");
}

function readAlongHtml(s, si) {
  const text = s.passage;
  const toks = [];
  const re = /\S+/g;
  let m;
  while ((m = re.exec(text))) toks.push({ start: m.index, end: m.index + m[0].length, text: m[0] });
  TOKS[si] = toks;
  let html = "", para = [], prevEnd = 0;
  toks.forEach((t, i) => {
    if (para.length && text.slice(prevEnd, t.start).includes("\n\n")) {
      html += `<p class="ar" lang="ar">${para.join(" ")}</p>`;
      para = [];
    }
    para.push(`<span class="w" data-si="${si}" data-i="${i}">${esc(t.text)}</span>`);
    prevEnd = t.end;
  });
  if (para.length) html += `<p class="ar" lang="ar">${para.join(" ")}</p>`;
  return html;
}

const RA = { run: 0, timer: null, si: null, cur: -1 };

function raClear() {
  clearInterval(RA.timer);
  RA.timer = null;
  document.querySelectorAll(".readalong .w.hl, .readalong .w.done").forEach(w => w.classList.remove("hl", "done"));
  document.querySelectorAll(".readalong .gloss").forEach(g => g.classList.remove("show"));
  RA.cur = -1;
}

// Show the English meaning just under the highlighted Arabic word.
function raGloss(si, w, idx) {
  const box = document.getElementById(`ra${si}`);
  const g = box && box.querySelector(".gloss");
  if (!g) return;
  const meaning = (EX.sections[si].gloss || [])[idx];
  if (!meaning) { g.classList.remove("show"); return; }
  g.textContent = meaning;
  g.classList.add("show");
  // Position relative to the passage box; keep the label inside its edges.
  const bw = box.clientWidth, gw = g.offsetWidth;
  let x = w.offsetLeft + w.offsetWidth / 2;
  x = Math.max(gw / 2 + 4, Math.min(bw - gw / 2 - 4, x));
  g.style.left = `${x}px`;
  g.style.top = `${w.offsetTop + w.offsetHeight}px`;
}
onStopSpeak(() => { RA.run++; raClear(); });

function raHighlight(si, idx) {
  if (idx === RA.cur) return;
  const box = document.getElementById(`ra${si}`);
  if (!box) return;
  const words = box.querySelectorAll(".w");
  for (let i = Math.max(0, RA.cur); i < idx && i < words.length; i++) words[i].classList.add("done");
  if (RA.cur >= 0 && words[RA.cur]) { words[RA.cur].classList.remove("hl"); words[RA.cur].classList.add("done"); }
  const w = words[idx];
  if (!w) return;
  w.classList.add("hl");
  RA.cur = idx;
  raGloss(si, w, idx);
  const det = box.closest("details");
  if (det && det.open) w.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

// Estimated timing, used when the browser's voice does not send word events.
function raEstimate(si, fromIdx, rate, run) {
  const toks = TOKS[si];
  const lettersPerSec = 13 * rate;
  const times = [];
  let t = 0;
  for (let i = fromIdx; i < toks.length; i++) {
    times.push(t);
    const letters = toks[i].text.replace(/[ً-ْٰـ]/g, "").length;
    t += (letters + 1.5) / lettersPerSec;
    if (/[.،,؛:!؟?]$/.test(toks[i].text)) t += 0.45;
  }
  const t0 = performance.now();
  clearInterval(RA.timer);
  RA.timer = setInterval(() => {
    if (run !== RA.run) return clearInterval(RA.timer);
    const el = (performance.now() - t0) / 1000;
    let k = 0;
    while (k + 1 < times.length && times[k + 1] <= el) k++;
    raHighlight(si, fromIdx + k);
  }, 80);
}

function readAlong(si, rate, fromIdx) {
  fromIdx = fromIdx || 0;
  const toks = TOKS[si];
  const base = toks[fromIdx].start;
  const text = spokenText(EX.sections[si]).slice(base);
  let gotBoundary = false;
  speak(text, rate, {
    onstart: () => {
      if (run !== RA.run) return;
      raHighlight(si, fromIdx);
      setTimeout(() => {
        if (run === RA.run && !gotBoundary) raEstimate(si, fromIdx, rate, run);
      }, 700);
    },
    onboundary: e => {
      if (run !== RA.run) return;
      if (e.name && e.name !== "word") return;
      if (!gotBoundary) { gotBoundary = true; clearInterval(RA.timer); }
      const pos = base + e.charIndex;
      let k = fromIdx;
      while (k + 1 < toks.length && toks[k + 1].start <= pos) k++;
      raHighlight(si, k);
    },
    onend: () => {
      if (run !== RA.run) return;
      clearInterval(RA.timer);
      setTimeout(() => { if (run === RA.run) raClear(); }, 600);
    },
  });
  // speak() calls stopSpeak(), which bumps RA.run — so take the id afterwards.
  const run = RA.run;
  RA.si = si;
  RA.cur = -1;
}

function passageHtml(s, si) {
  const paras = s.passage.split("\n\n").map(p => `<p class="ar" lang="ar">${esc(p)}</p>`).join("");
  if (s.type === "listening") {
    return `<div class="card">
      <p>🎧 Press play and listen (you can listen <b>twice</b>, like in the real exam). Answer without reading the text first!</p>
      <div class="row">
        <button data-play="${si}" data-rate="0.8">▶ Play</button>
        <button class="ghost" data-play="${si}" data-rate="0.6">🐢 Play slowly</button>
        <button class="ghost" data-readalong="${si}">📖 Read along</button>
        <button class="ghost" onclick="stopSpeak()">■ Stop</button>
        <span class="spacer"></span>
        <span id="plays${si}"></span>
      </div>
      <details id="tr${si}" style="margin-top:10px"><summary>Show transcript (after you answer)</summary>
        <p class="lead" style="font-size:.9rem;margin:8px 0 0">Words light up while they are read, with the English meaning underneath. Tap any word to start reading from there.</p>
        <div class="passage readalong" id="ra${si}" style="margin-top:8px"><b class="ar" lang="ar">${esc(s.passageTitle)}</b>${readAlongHtml(s, si)}<div class="gloss" aria-live="polite"></div></div>
      </details>
    </div>`;
  }
  return `<div class="passage"><b class="ar" lang="ar">${esc(s.passageTitle)}</b> ${sayBtn(s.passage)}${paras}</div>`;
}

function writingHtml(w) {
  return `<h2 class="section-title">Section 6 · Writing <span class="ar" lang="ar">الكتابة</span></h2>
    <div class="card">
      <p><b>${esc(w.task)}</b></p>
      <p class="ar" lang="ar">${esc(w.taskAr)}</p>
      <h3>Plan — use these frames in order</h3>
      <ul>${w.steps.map(s => `<li>${txt(s)}</li>`).join("")}</ul>
      <h3>Your answer</h3>
      <textarea id="writing" dir="rtl" lang="ar" placeholder="اُكْتُبْ هُنَا…"></textarea>
      <p class="lead" style="font-size:.9rem">Saved automatically on this device. Words: <span id="wc">0</span></p>
      <h3>Check yourself</h3>
      <div>${w.checklist.map((c, i) => `<label style="display:block"><input type="checkbox" data-ck="${i}"> ${txt(c)}</label>`).join("")}</div>
      <details style="margin-top:14px"><summary>Show model answer (only after you have written yours!)</summary>
        <div class="passage" style="margin-top:8px">${sayBtn(w.model)}<p class="ar" lang="ar">${esc(w.model)}</p></div>
      </details>
    </div>`;
}

function render() {
  const best = store.get(STORE + "-best");
  document.getElementById("exam").innerHTML = `
    <span class="tag">Practice exam ${setId === 1 ? "A" : "B"}</span>
    <h1>${esc(EX.title)}</h1>
    <p class="lead">${esc(EX.intro)} ${ALLQ.length} multiple-choice questions + 1 writing task. ${best ? `<br>Best score so far: <b>${best}</b>` : ""}</p>
    ${EX.sections.map((s, si) => `
      <h2 class="section-title">${esc(s.title)} <span class="ar" lang="ar">${esc(s.titleAr)}</span></h2>
      ${s.passage ? passageHtml(s, si) : ""}
      ${s.questions.map(questionHtml).join("")}
    `).join("")}
    ${writingHtml(EX.writing)}
    <div class="card" id="result" style="display:none"></div>`;

  // listening playback
  const countPlay = si => {
    const k = `plays${si}`;
    const n = (+(sess.get(STORE + k) || 0)) + 1;
    sess.set(STORE + k, n);
    document.getElementById(k).textContent = `played ${n}×`;
  };
  document.querySelectorAll("[data-play]").forEach(b => {
    b.onclick = () => {
      const si = +b.dataset.play;
      readAlong(si, +b.dataset.rate);
      countPlay(si);
    };
  });
  document.querySelectorAll("[data-readalong]").forEach(b => {
    b.onclick = () => {
      const si = +b.dataset.readalong;
      document.getElementById(`tr${si}`).open = true;
      readAlong(si, 0.7);
      countPlay(si);
    };
  });
  document.querySelectorAll(".readalong .w").forEach(w => {
    w.onclick = () => readAlong(+w.dataset.si, 0.7, +w.dataset.i);
  });

  // EN button: show / hide English under the Arabic question and options.
  document.querySelectorAll("[data-en]").forEach(b => {
    b.onclick = () => {
      const box = document.getElementById(b.dataset.en);
      const on = !box.classList.contains("show-en");
      box.classList.toggle("show-en", on);
      b.classList.toggle("active", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    };
  });

  // restore answers
  const saved = JSON.parse(store.get(STORE) || "{}");
  ALLQ.forEach(q => {
    const v = saved[q.id];
    if (v) {
      const inp = [...document.querySelectorAll(`input[name="${q.id}"]`)].find(i => i.value === v);
      if (inp) inp.checked = true;
    }
  });
  document.querySelectorAll(".opts input").forEach(inp => inp.addEventListener("change", () => {
    const s = JSON.parse(store.get(STORE) || "{}");
    s[inp.name] = inp.value;
    store.set(STORE, JSON.stringify(s));
    updateProgress();
  }));

  // writing autosave
  const ta = document.getElementById("writing");
  ta.value = store.get(STORE + "-writing") || "";
  const wc = () => document.getElementById("wc").textContent = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
  ta.oninput = () => { store.set(STORE + "-writing", ta.value); wc(); };
  wc();
  const ck = JSON.parse(store.get(STORE + "-ck") || "{}");
  document.querySelectorAll("[data-ck]").forEach(c => {
    c.checked = !!ck[c.dataset.ck];
    c.onchange = () => { ck[c.dataset.ck] = c.checked; store.set(STORE + "-ck", JSON.stringify(ck)); };
  });

  document.getElementById("submit").style.display = "";
  document.getElementById("retryWrong").style.display = "none";
  updateProgress();
}

function picked(q) {
  const inp = document.querySelector(`input[name="${q.id}"]:checked`);
  return inp ? inp.value : null;
}

function updateProgress() {
  const n = ALLQ.filter(picked).length;
  document.getElementById("progress").textContent = `Answered ${n} / ${ALLQ.length}`;
}

function grade() {
  const missing = ALLQ.filter(q => !picked(q));
  if (missing.length && !confirm(`${missing.length} question(s) not answered yet. Submit anyway?`)) {
    document.getElementById(missing[0].id).scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  let score = 0;
  const bySec = EX.sections.map(() => [0, 0]);
  ALLQ.forEach(q => {
    const box = document.getElementById(q.id);
    const p = picked(q);
    const ok = p === q.answer;
    if (ok) score++;
    bySec[q.si][1]++;
    if (ok) bySec[q.si][0]++;
    box.classList.remove("correct", "wrong");
    box.classList.add(ok ? "correct" : "wrong", "graded");
    box.querySelectorAll("label").forEach(l => {
      const inp = l.querySelector("input");
      l.classList.remove("is-answer", "is-picked-wrong");
      if (inp.value === q.answer) l.classList.add("is-answer");
      else if (inp.value === p) l.classList.add("is-picked-wrong");
      inp.disabled = true;
    });
  });
  const pct = Math.round(score / ALLQ.length * 100);
  const msg = pct >= 90 ? "🌟 Excellent!" : pct >= 75 ? "👍 Good — fix the red ones." : pct >= 50 ? "💪 Getting there — revise the Key Points page." : "📚 Go back to Key Points and Vocabulary, then try again.";
  const res = document.getElementById("result");
  res.style.display = "block";
  res.innerHTML = `<div class="result">Score: ${score} / ${ALLQ.length} (${pct}%) — ${msg}</div>
    <div class="table-wrap" style="margin-top:10px"><table>
      ${EX.sections.map((s, i) => `<tr><td>${esc(s.title)}</td><td>${bySec[i][0]} / ${bySec[i][1]}</td></tr>`).join("")}
    </table></div>
    <p>Read the 💡 explanation under every red question. Then press <b>Redo wrong ones</b>.</p>`;
  const prevBest = store.get(STORE + "-bestPct");
  if (!prevBest || pct > +prevBest) {
    store.set(STORE + "-bestPct", pct);
    store.set(STORE + "-best", `${score} / ${ALLQ.length} (${pct}%)`);
  }
  document.getElementById("submit").style.display = "none";
  document.getElementById("retryWrong").style.display = score < ALLQ.length ? "" : "none";
  res.scrollIntoView({ behavior: "smooth" });
}

function retryWrong() {
  const s = JSON.parse(store.get(STORE) || "{}");
  ALLQ.forEach(q => {
    const box = document.getElementById(q.id);
    const wrong = picked(q) !== q.answer;
    box.classList.remove("correct", "wrong", "graded");
    box.style.display = wrong ? "" : "none";
    box.querySelectorAll("label").forEach(l => {
      l.classList.remove("is-answer", "is-picked-wrong");
      const inp = l.querySelector("input");
      inp.disabled = false;
      if (wrong) inp.checked = false;
    });
    if (wrong) delete s[q.id];
  });
  store.set(STORE, JSON.stringify(s));
  document.getElementById("result").style.display = "none";
  document.getElementById("submit").style.display = "";
  document.getElementById("retryWrong").style.display = "none";
  updateProgress();
  const first = ALLQ.find(q => document.getElementById(q.id).style.display !== "none");
  if (first) document.getElementById(first.id).scrollIntoView({ behavior: "smooth", block: "center" });
}

document.getElementById("submit").onclick = grade;
document.getElementById("retryWrong").onclick = retryWrong;
document.getElementById("reset").onclick = () => {
  if (!confirm("Clear all multiple-choice answers and start again? (Your writing is kept.)")) return;
  store.remove(STORE);
  stopSpeak();
  // re-shuffle options
  ALLQ.forEach(q => q.shown = shuffle(q.opts));
  render();
  window.scrollTo(0, 0);
};

render();
</script>
</body>
</html>
